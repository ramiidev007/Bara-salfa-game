name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare build environment
        run: |
          # 1. Restore debug.keystore from base64 if present, or generate a valid keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 2. Ensure .env file exists for secrets-gradle-plugin
          touch .env
          
          # 3. Create placeholder google-services.json if needed
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"alsalfabarra"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.alsalfabarra.vkmz"}},"api_key":[{}]}]}' > app/google-services.json
          fi

      - name: Build Android APK
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Locate and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bara-Salfa-Game-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

